name: 'Speech to Text OpenAI Whisper'
description: 'High-performance inference of OpenAI Whisper automatic speech recognition (ASR) model'
author: 'Bo-Yi Wu'
inputs:
  model:
    description: 'public whisper model, standard or quantized (e.g. large-v3-turbo, large-v3-turbo-q5_0, large-v3-q5_0, large-v2-q5_0, medium-q5_0, small-q5_1, base-q5_1, tiny-q5_1)'
    default: 'large-v3-turbo-q5_0'
  audio_path:
    description: 'Audio Path.'
  output_folder:
    description: 'output folder.'
  output_format:
    description: 'output format, support txt, srt, csv.'
    default: 'txt'
  output_filename:
    description: 'output filename.'
  debug:
    description: 'enable debug mode.'
  print_progress:
    description: 'print progress.'
    default: 'true'
  print_segment:
    description: 'print segment.'
  youtube_url:
    description: 'youtube url(s) (supports single or multiple URLs separated by newlines, commas, or spaces)'
  youtube_urls:
    description: 'alias for youtube_url'
  translate:
    description: 'translate from source language to english'
  cut_silences:
    description: 'cut silences'
  prompt:
    description: 'initial prompt'
runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install -r ${{ github.action_path }}/requirements.txt
    - name: Run transcription
      shell: bash
      run: |
        urls="${{ inputs.youtube_urls || inputs.youtube_url }}"
        audio_path="${{ inputs.audio_path }}"
        translate_flag=""
        if [ "${{ inputs.translate }}" = "true" ]; then
          translate_flag="--translate"
        fi
        output_filename_flag=""
        if [ -n "${{ inputs.output_filename }}" ]; then
          output_filename_flag="--output-filename ${{ inputs.output_filename }}"
        fi

        python ${{ github.action_path }}/transcribe.py \
          --urls "$urls" \
          --audio-path "$audio_path" \
          --model "${{ inputs.model }}" \
          --format "${{ inputs.output_format }}" \
          --output-dir "${{ inputs.output_folder || 'youtube' }}" \
          $output_filename_flag \
          $translate_flag

branding:
  icon: 'terminal'
  color: 'gray-dark'
