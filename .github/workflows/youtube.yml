name: YouTube Whisper Transcription

on:
  workflow_dispatch:
    inputs:
      youtube_urls:
        description: 'YouTube Video URL(s) — enter one or more URLs (separated by newlines, commas, or spaces)'
        required: true
        type: string
      model:
        description: 'Whisper Model'
        required: true
        default: 'large-v3-turbo'
        type: choice
        options:
          - large-v3-turbo
          - large-v3
          - large-v2
          - medium
          - small
          - base
          - tiny
      output_format:
        description: 'Output format (comma-separated: txt, srt, csv, or all)'
        required: true
        default: 'txt,srt,csv'
      translate:
        description: 'Translate to English'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  transcribe:
    name: Transcribe YouTube Video(s)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache Whisper / Hugging Face model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: whisper-model-${{ inputs.model }}

      - name: Transcribe YouTube Video(s)
        run: |
          python transcribe.py \
            --urls "${{ inputs.youtube_urls }}" \
            --model "${{ inputs.model }}" \
            --format "${{ inputs.output_format }}" \
            --output-dir "youtube" \
            ${{ inputs.translate && '--translate' || '' }}

      - name: Upload transcripts as artifact
        uses: actions/upload-artifact@v4
        with:
          name: whisper-transcripts
          path: youtube/

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add youtube/
          if ! git diff --staged --quiet; then
            git commit -m "[skip ci] Transcribe YouTube videos via faster-whisper"
            git push
          else
            echo "No new transcripts to commit."
          fi


