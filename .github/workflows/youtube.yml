name: YouTube Whisper Transcription

on:
  workflow_dispatch:
    inputs:
      youtube_urls:
        description: 'YouTube Video URL(s) — enter one or more URLs (separated by newlines, commas, or spaces)'
        required: true
        type: string
      model:
        description: 'Whisper Model (Standard or Quantized)'
        required: true
        default: 'large-v3-turbo-q5_0'
        type: choice
        options:
          - large-v3-turbo-q5_0
          - large-v3-turbo-q8_0
          - large-v3-turbo
          - large-v3-q5_0
          - large-v3
          - large-v2-q5_0
          - large-v2-q8_0
          - large-v2
          - medium-q5_0
          - medium-q8_0
          - medium
          - small-q5_1
          - small-q8_0
          - small
          - base-q5_1
          - base-q8_0
          - base
          - tiny-q5_1
          - tiny-q8_0
          - tiny
      output_format:
        description: 'Output format (comma-separated: txt, srt, csv)'
        required: true
        default: 'txt,srt,csv'
      translate:
        description: 'Translate to English'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  transcribe-youtube:
    name: Transcribe YouTube Video(s)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Speech to text with Whisper
        uses: ./
        with:
          model: ${{ inputs.model }}
          youtube_urls: ${{ inputs.youtube_urls }}
          output_format: ${{ inputs.output_format }}
          output_folder: youtube
          print_segment: true
          translate: ${{ inputs.translate }}
          debug: true

      - name: Upload transcripts as artifact
        uses: actions/upload-artifact@v4
        with:
          name: whisper-transcripts
          path: youtube/

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add youtube/
          if ! git diff --staged --quiet; then
            git commit -m "[skip ci] Transcribe YouTube videos via Whisper"
            git push
          else
            echo "No changes to commit."
          fi

