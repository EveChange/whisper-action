name: Transcribe Audio Folder

on:
  workflow_dispatch:
    inputs:
      audio_folder:
        description: 'Folder or file path in repo (e.g. audio, audio/*.ogg, testdata)'
        required: true
        default: 'audio'
        type: string
      model:
        description: 'Whisper Model'
        required: true
        default: 'large-v3-turbo'
        type: choice
        options:
          - large-v3-turbo
          - large-v3
          - large-v2
          - medium
          - small
          - base
          - tiny
      output_format:
        description: 'Output format (srt, txt, csv, or all)'
        required: true
        default: 'srt'
        type: choice
        options:
          - srt
          - txt,srt
          - txt,srt,csv
          - all
      translate:
        description: 'Translate to English'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  transcribe-folder:
    name: Transcribe Audio Folder
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Transcribe Audio File(s)
        run: |
          python transcribe.py \
            --audio-path "${{ inputs.audio_folder }}" \
            --model "${{ inputs.model }}" \
            --format "${{ inputs.output_format }}" \
            ${{ inputs.translate && '--translate' || '' }}

      - name: Upload subtitles as artifact
        uses: actions/upload-artifact@v4
        with:
          name: audio-subtitles
          path: |
            **/*.srt
            **/*.txt
            **/*.csv
          if-no-files-found: warn

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${{ inputs.audio_folder }}"
          if ! git diff --staged --quiet; then
            git commit -m "[skip ci] Transcribe audio in ${{ inputs.audio_folder }} via faster-whisper"
            git push
          else
            echo "No new subtitles to commit."
          fi
