name: Transcribe Audio Folder (Parallel)

on:
  workflow_dispatch:
    inputs:
      audio_folder:
        description: 'Folder containing audio files (e.g. audio)'
        required: true
        default: 'audio'
        type: string
      model:
        description: 'Whisper Model'
        required: true
        default: 'large-v3-turbo'
        type: choice
        options:
          - large-v3-turbo
          - large-v3
          - large-v2
          - medium
          - small
          - base
          - tiny
      output_format:
        description: 'Output format (srt, txt, csv, or all)'
        required: true
        default: 'srt'
        type: choice
        options:
          - srt
          - txt,srt
          - txt,srt,csv
          - all
      translate:
        description: 'Translate to English'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  find-files:
    name: Discover Audio Files
    runs-on: ubuntu-latest
    outputs:
      files: ${{ steps.scan.outputs.files }}
      count: ${{ steps.scan.outputs.count }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Scan audio files
        id: scan
        run: |
          python -c '
          import os, json
          folder = "${{ inputs.audio_folder }}"
          exts = (".ogg", ".wav", ".mp3", ".m4a", ".flac", ".opus", ".aac", ".mp4", ".mkv")
          files = []
          if os.path.isdir(folder):
              for root, _, filenames in os.walk(folder):
                  for f in sorted(filenames):
                      if f.lower().endswith(exts):
                          files.append(os.path.join(root, f))
          elif os.path.isfile(folder):
              files.append(folder)
          files = sorted(list(set(files)))
          print(f"Discovered {len(files)} files:", files)
          with open(os.environ["GITHUB_OUTPUT"], "a") as gh_out:
              gh_out.write(f"files={json.dumps(files)}\n")
              gh_out.write(f"count={len(files)}\n")
          '

  transcribe-parallel:
    name: Transcribe (${{ matrix.file }})
    needs: find-files
    if: needs.find-files.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        file: ${{ fromJson(needs.find-files.outputs.files) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache Whisper / Hugging Face model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: whisper-model-${{ inputs.model }}

      - name: Transcribe audio file
        run: |
          rel_dir=$(dirname "${{ matrix.file }}")
          mkdir -p "output_artifacts/$rel_dir"
          python transcribe.py \
            --audio-path "${{ matrix.file }}" \
            --model "${{ inputs.model }}" \
            --format "${{ inputs.output_format }}" \
            --output-dir "output_artifacts/$rel_dir" \
            ${{ inputs.translate && '--translate' || '' }}

      - name: Upload subtitle artifact
        uses: actions/upload-artifact@v4
        with:
          name: subtitle-${{ strategy.job-index }}
          path: output_artifacts/
          if-no-files-found: error

  publish:
    name: Aggregate & Commit Subtitles
    needs: [find-files, transcribe-parallel]
    if: always() && needs.find-files.outputs.count != '0'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download all subtitle artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: subtitle-*
          merge-multiple: true
          path: downloaded-artifacts

      - name: Organize subtitles into repo
        run: |
          cp -r downloaded-artifacts/* .
          rm -rf downloaded-artifacts

      - name: Upload all subtitles bundle
        uses: actions/upload-artifact@v4
        with:
          name: all-subtitles
          path: |
            ${{ inputs.audio_folder }}/**/*.srt
            ${{ inputs.audio_folder }}/**/*.txt
            ${{ inputs.audio_folder }}/**/*.csv
          if-no-files-found: ignore

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${{ inputs.audio_folder }}"
          if ! git diff --staged --quiet; then
            git commit -m "[skip ci] Transcribe audio in ${{ inputs.audio_folder }} via faster-whisper"
            git push
          else
            echo "No new subtitles to commit."
          fi

